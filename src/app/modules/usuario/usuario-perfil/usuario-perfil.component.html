<mat-card>
    <mat-card-title>
      Perfil
    </mat-card-title>
    <mat-card-content>
      <table class="campos-cadastro" cellspacing="0">
        <tr>
          <td>
            <mat-form-field color="primary" class="campo-cadastro">
              <input matInput placeholder="Nome completo" [value]="usuario.nome" disabled>
            </mat-form-field>
          </td>
        </tr>
        <tr>
          <td>
            <mat-form-field color="primary" class="campo-cadastro">
              <input matInput placeholder="Email UFF" [value]="usuario.email" disabled>
            </mat-form-field>
          </td>
        </tr>
        <tr>
          <td>
            <mat-form-field color="primary" class="campo-cadastro">
              <input matInput placeholder="Celular (Whatsapp)" [value]="usuario.telefone" disabled>
            </mat-form-field>
          </td>
        </tr>
      </table>
    </mat-card-content>
    <mat-card-actions>
        <button mat-raised-button color="primary" [routerLink]="'/usuario/cadastro'">
          Editar Perfil
        </button>
      </mat-card-actions>
  </mat-card>
