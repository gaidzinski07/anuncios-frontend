<mat-sidenav-container autosize>
    <mat-sidenav #drawer [opened]="true" mode="side">
      <mat-nav-list>
        <a mat-list-item href="/login">
          <span class="entry">
            <mat-icon>login</mat-icon>
            <span>Login</span>
          </span>
        </a>
        <a mat-list-item href="/usuario/cadastro">
          <span class="entry">
            <mat-icon>account_circle</mat-icon>
            <span>Cadastrar usuário</span>
          </span>
        </a>
        <a mat-list-item href="/anuncio/cadastro">
          <span class="entry">
            <mat-icon>add_circle</mat-icon>
            <span>Criar anúncio</span>
          </span>
        </a>
        <a mat-list-item href="/anuncio/pesquisa">
          <span class="entry">
            <mat-icon>search</mat-icon>
            <span>Buscar anúncios</span>
          </span>
        </a>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      <ng-content></ng-content>
    </mat-sidenav-content>
  </mat-sidenav-container>
